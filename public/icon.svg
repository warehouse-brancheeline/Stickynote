<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2196F3" />
      <stop offset="100%" stop-color="#0D47A1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#040e21" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bgGrad)" filter="url(#shadow)" stroke="#90CAF9" stroke-width="6" stroke-opacity="0.4" />

  <!-- Note sheet -->
  <rect x="112" y="112" width="288" height="288" rx="32" fill="#E3F2FD" fill-opacity="0.95" />
  
  <!-- Note lines in #0D47A1 -->
  <line x1="160" y1="180" x2="310" y2="180" stroke="#0D47A1" stroke-width="18" stroke-linecap="round" />
  <line x1="160" y1="230" x2="352" y2="230" stroke="#2196F3" stroke-width="16" stroke-linecap="round" />
  <line x1="160" y1="280" x2="280" y2="280" stroke="#90CAF9" stroke-width="14" stroke-linecap="round" />

  <!-- Alarm Bell Badge in bottom-right corner -->
  <circle cx="360" cy="360" r="80" fill="#2196F3" stroke="#E3F2FD" stroke-width="10" />
  <path d="M360 320c-16.57 0-30 13.43-30 30v18l-8 8v6h76v-6l-8-8v-18c0-16.57-13.43-30-30-30zm-12 68c0 6.63 5.37 12 12 12s12-5.37 12-12h-24z" fill="#E3F2FD" />
